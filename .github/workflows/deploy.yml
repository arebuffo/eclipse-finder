name: Deploy

# Deploys the public app files to Cloudflare Workers (eclipsefinders.com)
# on every push to main. Requires two repo secrets (Settings → Secrets and
# variables → Actions): CLOUDFLARE_API_TOKEN (Account · Workers Scripts ·
# Edit) and CLOUDFLARE_ACCOUNT_ID. The deploy step skips if they're absent.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage public files
        run: |
          mkdir -p /tmp/stage
          cp index.html style.css app.js i18n.js engine.mjs path-data.js \
             sw.js manifest.webmanifest favicon.svg wrangler.jsonc /tmp/stage/
          cp -r icons vendor fonts /tmp/stage/
      - name: Deploy to Cloudflare Workers
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: /tmp/stage
