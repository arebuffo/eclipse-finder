name: Deploy to GitHub Pages

# Branch-based Pages deploy: mirrors main to gh-pages (no build step needed).
# Pushing gh-pages auto-activates GitHub Pages on public repos, and avoids the
# Pages-API permissions that the Actions token lacks for site creation.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish main to gh-pages
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git push origin --force HEAD:gh-pages
